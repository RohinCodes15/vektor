# Fly.io manifest for the Vektor backend (Phase 5A). Paper-only: no broker settings exist.
# Live at https://vektor-api.fly.dev for the frontend at https://vektor-paper.vercel.app (see backend/DEPLOYMENT.md).
# Secrets (VEKTOR_OWNER_KEY, and VEKTOR_AI_API_KEY if AI is ever turned on) go in `fly secrets`, never in this file.
app = "vektor-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[deploy]
  strategy = "immediate"  # one machine with one volume: there is no second machine to roll onto

[env]
  VEKTOR_ENVIRONMENT = "production"
  VEKTOR_TRADING_MODE = "paper"
  VEKTOR_PORTFOLIO_DB_PATH = "/data/portfolios.sqlite3"
  VEKTOR_BACKTEST_DB_PATH = "/data/backtests.sqlite3"
  VEKTOR_MARKET_DATA_CACHE_PATH = "/data/market_data.sqlite3"
  VEKTOR_AI_PROVIDER = "none"
  VEKTOR_LOG_LEVEL = "INFO"
  # Fly's proxy appends the client's address to X-Forwarded-For. Rate limits key on that entry, never on the
  # client-written ones to its left; otherwise every client shares one limit or picks a new address per request.
  VEKTOR_TRUSTED_PROXY_HOPS = "1"
  # Lets uvicorn take the scheme (https) from Fly's proxy. It does not decide the rate-limit address.
  FORWARDED_ALLOW_IPS = "*"
  # Required. The exact https origin(s) of the frontend, as a JSON list. Startup fails without it.
  VEKTOR_CORS_ORIGINS = '["https://vektor-paper.vercel.app"]'
  # Public: there are no user accounts, so paper portfolio writes need the owner key (a Fly secret).
  VEKTOR_PUBLIC_MODE = "true"
  # Lower than the 300 default: bounds what one client can cost in outbound bandwidth ($0.02/GB on Fly).
  VEKTOR_RATE_LIMIT_PER_MINUTE = "60"

[[mounts]]
  source = "vektor_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/v1/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
